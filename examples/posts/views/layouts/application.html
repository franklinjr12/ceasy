<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{page_title}} · Ceasy Journal</title><link rel="stylesheet" href="/styles/application.css"></head><body><header class="site-header"><div class="container nav-shell"><a class="brand" href="/">Ceasy Journal</a><nav class="desktop-nav"><a href="/posts">Browse</a>{{#signed_in}}<a href="/dashboard">Dashboard</a><a class="button button-small" href="/posts/new">Write</a><a href="/account">{{current_user_name}}</a><form class="inline-form" method="POST" action="/logout"><input type="hidden" name="_method" value="DELETE"><input type="hidden" name="_csrf" value="{{csrf_token}}"><button class="link-button" type="submit">Sign out</button></form>{{/signed_in}}{{^signed_in}}<a href="/login">Sign in</a><a class="button button-small" href="/signup">Create account</a>{{/signed_in}}</nav></div></header><main class="container">{{#flash_success}}<div class="flash flash-success">{{flash_success}}<button class="flash-dismiss" type="button">×</button></div>{{/flash_success}}{{#flash_notice}}<div class="flash flash-notice">{{flash_notice}}<button class="flash-dismiss" type="button">×</button></div>{{/flash_notice}}{{#flash_error}}<div class="flash flash-error">{{flash_error}}<button class="flash-dismiss" type="button">×</button></div>{{/flash_error}}{{yield}}</main><script src="/scripts/application.js" defer></script></body></html>
