<h1>Account settings</h1><section class="settings-grid"><form class="post-form" method="POST" action="/account"><input type="hidden" name="_method" value="PATCH"><input type="hidden" name="_csrf" value="{{csrf_token}}"><h2>Profile</h2><label>Name</label><input name="name" value="{{user.name}}">{{#name_error}}<p class="field-error">{{name_error}}</p>{{/name_error}}<label>Bio</label><textarea name="bio">{{user.bio}}</textarea>{{#bio_error}}<p class="field-error">{{bio_error}}</p>{{/bio_error}}<button class="button" type="submit">Save profile</button></form><form class="post-form" method="POST" action="/account/password"><input type="hidden" name="_method" value="PATCH"><input type="hidden" name="_csrf" value="{{csrf_token}}"><h2>Change password</h2><label>Current password</label><input type="password" name="current_password"><label>New password</label><input type="password" name="password"><label>Confirm new password</label><input type="password" name="password_confirmation"><button class="button" type="submit">Update password</button></form></section>
